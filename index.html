  background-position:center 55%;
  background-size:min(560px,70vw);
  opacity:.05;
  pointer-events:none;
  z-index:0;
}
.app{position:relative; z-index:1;}
h1,h2,h3,h4{font-family:'Almarai',sans-serif; font-weight:800; letter-spacing:.1px;}
a{color:inherit; text-decoration:none;}
button{font-family:inherit; cursor:pointer;}
::selection{background:var(--gold); color:var(--ink);}
::-webkit-scrollbar{width:8px; height:8px;}
::-webkit-scrollbar-thumb{background:var(--surface4); border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- kufic-style decorative pattern (brand signature) ---------- */
.kufic-strip{
  position:absolute; inset-inline-end:0; top:0; bottom:0; width:10px;
  background-image:repeating-linear-gradient(0deg, var(--gold) 0 6px, transparent 6px 14px);
  opacity:.55;
}

/* ---------- shell ---------- */
.app{display:flex; min-height:100vh;}
.sidebar{
  width:264px; flex-shrink:0;
  background:linear-gradient(180deg,#0f1c34,#0a1428);
  border-left:1px solid var(--line);
  display:flex; flex-direction:column;
  position:sticky; top:0; height:100vh;
}
.brand{
  padding:26px 22px 22px; border-bottom:1px solid var(--line);
  position:relative; overflow:hidden; text-align:center;
  background:
    repeating-linear-gradient(135deg, rgba(184,145,76,.05) 0 2px, transparent 2px 16px);
}
.brand-logo{width:100%; max-width:220px; height:auto; display:block; margin:0 auto;}
.brand-logo-light{display:none;}
.brand-logo-dark{display:block;}
[data-theme="light"] .brand-logo-light{display:block;}
[data-theme="light"] .brand-logo-dark{display:none;}

nav{flex:1; padding:16px 12px; overflow-y:auto;}
.nav-item{
  display:flex; align-items:center; gap:11px;
  padding:10.5px 14px; border-radius:9px; margin-bottom:2px;
  color:var(--text-dim); font-size:14px; font-weight:500;
  border:1px solid transparent; transition:.15s;
}
.nav-item svg{width:18px; height:18px; flex-shrink:0; opacity:.85; stroke:currentColor;}
.nav-item:hover{background:var(--surface2); color:var(--text);}
.nav-item.active{
  background:linear-gradient(90deg, rgba(184,145,76,.16), rgba(184,145,76,.02));
  border-color:rgba(184,145,76,.32); color:var(--gold-light);
}
.nav-item.active svg{opacity:1;}
.nav-group-label{font-size:10.5px; color:var(--text-faint); padding:16px 14px 6px; letter-spacing:.6px; font-weight:700;}

.sidebar-foot{padding:14px 20px; border-top:1px solid var(--line); font-size:10.5px; color:var(--text-faint); line-height:1.9;}
.sidebar-foot b{color:var(--text-dim);}

main{flex:1; min-width:0; padding:26px 32px 60px; max-width:1240px;}
.topbar{display:flex; align-items:flex-start; justify-content:space-between; gap:14px; margin-bottom:24px; flex-wrap:wrap;}
.topbar h2{font-size:24px; color:var(--text);}
.topbar .sub{color:var(--text-dim); font-size:13px; margin-top:5px; font-weight:400;}
.topbar-actions{display:flex; align-items:center; gap:10px;}
.hijri{font-size:11.5px; color:var(--text-faint); margin-top:6px;}

.hamburger{display:none;}
.util-bar{display:flex; justify-content:flex-end; margin-bottom:10px;}
.theme-btn{width:38px; height:38px; border-radius:10px; background:var(--surface);}
.theme-btn svg{width:17px; height:17px;}

/* ---------- auth gate ---------- */
.auth-screen{
  position:fixed; inset:0; z-index:500; display:flex; align-items:center; justify-content:center;
  background:var(--ink);
  background-image:
    radial-gradient(ellipse 1000px 560px at 88% -8%, rgba(184,145,76,.09), transparent),
    radial-gradient(ellipse 800px 560px at -4% 105%, rgba(79,146,113,.05), transparent);
  padding:20px;
}
.auth-card{
  width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line);
  border-radius:14px; padding:30px 26px; text-align:center; box-shadow:var(--shadow);
}
.auth-card .brand-logo{width:100%; max-width:210px; margin:0 auto 18px;}
.auth-card h2{font-size:19px; color:var(--gold-light); margin-bottom:8px;}
.auth-card .sub{font-size:12.5px; color:var(--text-dim); line-height:1.8; margin-bottom:18px;}
.auth-card .field{text-align:right;}
.auth-err{color:var(--danger-light); font-size:12.5px; margin-bottom:10px; display:none;}

/* ---------- entrance animations ---------- */
@keyframes fadeUp{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
.stat-grid .stat-card{animation:fadeUp .4s ease both;}
.stat-grid .stat-card:nth-child(1){animation-delay:.02s;}
.stat-grid .stat-card:nth-child(2){animation-delay:.08s;}
.stat-grid .stat-card:nth-child(3){animation-delay:.14s;}
.stat-grid .stat-card:nth-child(4){animation-delay:.2s;}
.two-col .panel{animation:fadeUp .45s ease both;}
.stat-card{cursor:pointer;}
.stat-card:active{transform:translateY(0) scale(.98);}

/* ---------- quick actions ---------- */
.quick-actions{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px;}
.qa-btn{
  display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
  padding:10px 15px; border-radius:30px; font-size:12.5px; font-weight:600; color:var(--text-dim); transition:.15s;
}
.qa-btn svg{width:15px; height:15px; color:var(--gold-light);}
.qa-btn:hover{border-color:var(--gold); color:var(--text); transform:translateY(-1px); box-shadow:var(--shadow);}

/* ---------- greeting / live clock ---------- */
.greet-row{display:flex; align-items:baseline; gap:10px; flex-wrap:wrap;}
.live-clock{font-family:'Almarai'; font-weight:800; font-size:13px; color:var(--gold-light); direction:ltr;}

/* ---------- bell / notifications ---------- */
.bell-wrap{position:relative;}
.bell-btn{
  position:relative; background:var(--surface); border:1px solid var(--line); color:var(--text-dim);
  width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center;
}
.bell-btn svg{width:19px; height:19px;}
.bell-btn:hover{border-color:var(--gold); color:var(--gold-light);}
.bell-badge{
  position:absolute; top:-5px; left:-5px; background:var(--danger); color:#fff; font-size:10px; font-weight:700;
  min-width:17px; height:17px; border-radius:9px; display:flex; align-items:center; justify-content:center; padding:0 4px;
  border:2px solid var(--ink);
}
.bell-panel{
  position:absolute; top:48px; left:0; width:320px; max-height:400px; overflow-y:auto;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow);
  padding:8px; display:none; z-index:60;
}
.bell-panel.open{display:block;}
.bell-item{display:flex; align-items:flex-start; gap:10px; padding:10px 10px; border-radius:8px;}
.bell-item:hover{background:var(--surface2);}
.bell-item .dot{width:8px; height:8px; border-radius:50%; margin-top:5px; flex-shrink:0;}
.bell-item .t{font-size:12.5px; font-weight:600;}
.bell-item .m{font-size:11px; color:var(--text-faint); margin-top:2px;}

/* ---------- alert banner (agency expiry) ---------- */
.alert-banner{
  display:flex; align-items:flex-start; gap:12px;
  background:linear-gradient(90deg, rgba(192,83,58,.14), rgba(192,83,58,.04));
  border:1px solid rgba(192,83,58,.4); border-radius:var(--radius);
  padding:14px 16px; margin-bottom:22px;
}
.alert-banner svg{width:20px; height:20px; color:var(--danger-light); flex-shrink:0; margin-top:2px;}
.alert-banner .body{flex:1;}
.alert-banner b{font-size:13.5px; color:var(--danger-light); display:block; margin-bottom:4px;}
.alert-banner p{font-size:12.5px; color:var(--text-dim); line-height:1.8;}
.alert-banner .close{background:transparent; border:none; color:var(--text-faint); font-size:16px; padding:2px 6px;}
.alert-banner .close:hover{color:var(--text);}

/* ---------- stat / card system ---------- */
.stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:22px;}
.stat-card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
  padding:17px 18px; position:relative; overflow:hidden; transition:.15s;
}
.stat-card:hover{border-color:var(--gold); transform:translateY(-1px);}
.stat-card::before{content:""; position:absolute; inset-inline-start:0; top:0; bottom:0; width:3px; background:var(--gold);}
.stat-card .top-row{display:flex; align-items:center; justify-content:space-between;}
.stat-card .ico-badge{width:32px; height:32px; border-radius:9px; background:var(--gold-dim); border:1px solid rgba(184,145,76,.3); display:flex; align-items:center; justify-content:center;}
.stat-card .ico-badge svg{width:16px; height:16px; color:var(--gold-light);}
.stat-card .num{font-family:'Almarai',sans-serif; font-weight:800; font-size:28px; color:var(--gold-light); line-height:1; margin-top:12px;}
.stat-card .lbl{font-size:12px; color:var(--text-dim); margin-top:6px;}
.stat-card.danger::before{background:var(--danger);}
.stat-card.danger .num{color:var(--danger-light);}
.stat-card.danger .ico-badge{background:var(--danger-dim); border-color:rgba(192,83,58,.35);}
.stat-card.danger .ico-badge svg{color:var(--danger-light);}
.stat-card.ok::before{background:var(--ok);}
.stat-card.ok .num{color:var(--ok-light);}
.stat-card.ok .ico-badge{background:var(--ok-dim); border-color:rgba(79,146,113,.35);}
.stat-card.ok .ico-badge svg{color:var(--ok-light);}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:20px 22px; margin-bottom:20px; box-shadow:var(--shadow);}
.panel h3{font-size:16px; color:var(--gold-light); margin-bottom:14px; display:flex; align-items:center; justify-content:space-between; font-weight:800;}
.panel h3 .titlewrap{display:flex; align-items:center; gap:9px;}
.panel h3 svg{width:17px; height:17px; opacity:.9;}
.panel h3 .count{font-family:'Tajawal'; font-size:11px; color:var(--text-faint); font-weight:500;}

.two-col{display:grid; grid-template-columns:1.5fr 1fr; gap:18px; align-items:start;}

.empty{text-align:center; padding:36px 10px; color:var(--text-faint);}
.empty svg{width:30px; height:30px; margin-bottom:10px; opacity:.4;}
.empty p{font-size:13px;}

/* ---------- donut chart ---------- */
.donut-wrap{display:flex; align-items:center; gap:20px;}
.donut{width:108px; height:108px; border-radius:50%; flex-shrink:0; position:relative;}
.donut::after{content:""; position:absolute; inset:14px; border-radius:50%; background:var(--surface);}
.donut-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:2;}
.donut-center b{font-family:'Almarai'; font-size:19px; color:var(--gold-light);}
.donut-center span{font-size:9.5px; color:var(--text-faint);}
.legend{display:flex; flex-direction:column; gap:9px; font-size:12.5px;}
.legend .li{display:flex; align-items:center; gap:8px;}
.legend .sw{width:10px; height:10px; border-radius:3px;}
.legend b{font-family:'Tajawal';}

/* ---------- case file card ---------- */
.case-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(275px,1fr)); gap:14px;}
.file-card{
  position:relative; background:linear-gradient(180deg,#182c4c,#152540);
  border:1px solid var(--line); border-radius:11px; padding:18px 16px 16px; cursor:pointer; transition:.15s;
}
.file-card::before{
  content:attr(data-tab); position:absolute; top:-11px; right:16px;
  background:var(--surface4); color:var(--text-dim); font-size:10px; padding:4px 11px 3px; border-radius:6px 6px 0 0;
  border:1px solid var(--line); border-bottom:none; font-weight:600;
}
.file-card:hover{border-color:var(--gold); transform:translateY(-2px); box-shadow:var(--shadow);}
.file-card .status-dot{position:absolute; top:15px; left:15px; width:9px; height:9px; border-radius:50%; box-shadow:0 0 0 3px rgba(255,255,255,.05);}
.status-active{background:var(--ok);} .status-postponed{background:var(--gold);} .status-closed{background:var(--text-faint);}
.file-card .case-title{font-family:'Almarai',sans-serif; font-weight:700; font-size:15.5px; color:var(--text); margin-bottom:8px; padding-left:16px; line-height:1.4;}
.file-card .case-meta{font-size:12px; color:var(--text-dim); line-height:2;}
.file-card .case-meta b{color:var(--text-faint); font-weight:500;}
.file-card .next-hearing{margin-top:10px; padding-top:10px; border-top:1px dashed var(--line); font-size:12px; display:flex; align-items:center; gap:6px;}
.file-card .next-hearing svg{width:13px; height:13px;}
.tag{display:inline-flex; align-items:center; gap:4px; font-size:10.5px; padding:3px 10px; border-radius:20px; border:1px solid var(--line); color:var(--text-dim);}

/* ---------- lists ---------- */
.row-list{display:flex; flex-direction:column; gap:8px;}
.row-item{
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:12px 15px; font-size:13.5px; transition:.15s;
}
.row-item:hover{border-color:var(--line-soft); background:var(--surface3);}
.row-item .main{display:flex; flex-direction:column; gap:2px; min-width:0;}
.row-item .main b{font-weight:700; font-size:14px;}
.row-item .meta{color:var(--text-faint); font-size:11.5px;}
.row-item .actions{display:flex; gap:6px; flex-shrink:0;}
.icon-btn{
  background:transparent; border:1px solid var(--line); color:var(--text-dim);
  width:31px; height:31px; border-radius:8px; display:flex; align-items:center; justify-content:center; transition:.15s;
}
.icon-btn svg{width:14px; height:14px;}
.icon-btn:hover{border-color:var(--gold); color:var(--gold-light);}
.icon-btn.del:hover{border-color:var(--danger); color:var(--danger-light);}
.task-check{width:20px; height:20px; border-radius:6px; border:1.5px solid var(--text-faint); flex-shrink:0; display:flex; align-items:center; justify-content:center; transition:.15s;}
.task-check svg{width:13px; height:13px; color:#fff;}
.task-check.done{background:var(--ok); border-color:var(--ok);}
.row-item.overdue{border-color:var(--danger);}
.row-item.overdue .meta{color:var(--danger-light);}
.row-item.soon{border-color:var(--gold);}

/* ---------- avatar ---------- */
.avatar{
  width:38px; height:38px; border-radius:10px; background:var(--gold-dim); border:1px solid rgba(184,145,76,.3);
  display:flex; align-items:center; justify-content:center; font-family:'Almarai'; font-weight:800; color:var(--gold-light); font-size:14px; flex-shrink:0;
}

/* ---------- buttons ---------- */
.btn{display:inline-flex; align-items:center; gap:7px; justify-content:center; background:var(--surface3); border:1px solid var(--line); color:var(--text); padding:9px 16px; border-radius:9px; font-size:13.5px; font-weight:600; transition:.15s;}
.btn svg{width:15px; height:15px;}
.btn:hover{border-color:var(--gold);}
.btn-gold{background:linear-gradient(180deg,var(--gold-light),var(--gold)); color:#231a05; border:none; font-weight:700;}
.btn-gold:hover{filter:brightness(1.08);}
.btn-ghost{background:transparent; border:1px solid var(--line); color:var(--text-dim);}
.btn-whatsapp{background:#25D366; color:#0b2b16; border:none; font-weight:700;}
.btn-whatsapp:hover{filter:brightness(1.06);}
.btn-sm{padding:6px 12px; font-size:12.5px;}
.btn-block{width:100%;}
.btn[disabled]{opacity:.4; pointer-events:none;}

/* ---------- forms ---------- */
.field{margin-bottom:14px;}
.field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:600;}
.field input, .field select, .field textarea{width:100%; background:var(--surface2); border:1px solid var(--line); color:var(--text); padding:10px 12px; border-radius:8px; font-size:14px; font-family:inherit;}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--gold); border-color:var(--gold);}
.field textarea{resize:vertical; min-height:70px;}
.field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
.field input[type=file]{padding:8px; font-size:12.5px; color:var(--text-dim);}
.cal-toggle{display:flex; gap:4px; background:var(--surface2); border:1px solid var(--line); border-radius:7px; padding:2px;}
.cal-btn{background:transparent; border:none; color:var(--text-faint); font-size:11px; padding:4px 9px; border-radius:5px; font-weight:600;}
.cal-btn.active{background:var(--gold-dim); color:var(--gold-light);}
.hijri-row{display:flex; gap:8px;}
.hijri-row input{flex:1; min-width:0;}

/* ---------- modal ---------- */
.overlay{position:fixed; inset:0; background:rgba(4,8,17,.75); backdrop-filter:blur(2px); display:none; align-items:flex-start; justify-content:center; padding:5vh 16px; z-index:600; overflow-y:auto;}
.overlay.open{display:flex;}
.modal{background:var(--surface); border:1px solid var(--line); border-radius:14px; width:100%; max-width:540px; padding:24px; margin-bottom:5vh; box-shadow:0 20px 60px rgba(0,0,0,.55);}
.modal h3{font-size:18px; color:var(--gold-light); margin-bottom:18px;}
.modal-actions{display:flex; gap:10px; margin-top:18px;}

/* ---------- resources / legal ---------- */
.res-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(232px,1fr)); gap:12px;}
.res-card{display:flex; align-items:flex-start; gap:12px; background:var(--surface2); border:1px solid var(--line); border-radius:10px; padding:14px 15px; transition:.15s;}
.res-card:hover{border-color:var(--gold); background:var(--surface3); transform:translateY(-1px);}
.res-card .ico{width:37px; height:37px; border-radius:9px; background:var(--gold-dim); border:1px solid rgba(184,145,76,.3); display:flex; align-items:center; justify-content:center; color:var(--gold-light); flex-shrink:0;}
.res-card .ico svg{width:17px; height:17px;}
.res-card .txt b{font-size:13.5px; display:block; margin-bottom:2px;}
.res-card .txt span{font-size:11px; color:var(--text-faint);}
.info-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.info-card h4{color:var(--gold-light); font-size:14.5px; margin-bottom:9px; display:flex; align-items:center; gap:8px; font-family:'Almarai'; font-weight:800;}
.info-card h4 svg{width:16px; height:16px;}
.info-card ul{padding-inline-start:18px; font-size:13px; color:var(--text-dim); line-height:2;}
.disclaimer{border:1px dashed var(--danger); background:var(--danger-dim); border-radius:9px; padding:12px 15px; font-size:12.5px; color:var(--danger-light); margin-top:16px; line-height:1.9; display:flex; gap:10px; align-items:flex-start;}
.disclaimer svg{width:16px; height:16px; flex-shrink:0; margin-top:2px;}

/* ---------- AI ---------- */
.ai-wrap{display:grid; grid-template-columns:1.3fr .9fr; gap:18px; align-items:start;}
.chat-log{display:flex; flex-direction:column; gap:12px; max-height:420px; overflow-y:auto; margin-bottom:14px; padding-inline-end:4px;}
.msg{padding:11px 14px; border-radius:10px; font-size:13.5px; line-height:1.85; max-width:92%;}
.msg.user{background:var(--surface3); align-self:flex-end; border:1px solid var(--line);}
.msg.ai{background:var(--gold-dim); border:1px solid rgba(184,145,76,.28); align-self:flex-start; white-space:pre-wrap;}
.msg.err{background:var(--danger-dim); border:1px solid var(--danger); color:var(--danger-light); align-self:flex-start;}
.chip-row{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
.chip{font-size:12px; padding:6px 12px; border-radius:20px; border:1px solid var(--line); color:var(--text-dim); background:var(--surface2);}
.chip:hover{border-color:var(--gold); color:var(--gold-light);}
.ask-row{display:flex; gap:8px;}
.ask-row textarea{flex:1;}
.typing{display:flex; gap:4px; padding:6px 0;}
.typing span{width:6px; height:6px; border-radius:50%; background:var(--gold); animation:blink 1.2s infinite ease-in-out;}
.typing span:nth-child(2){animation-delay:.2s;} .typing span:nth-child(3){animation-delay:.4s;}
@keyframes blink{0%,80%,100%{opacity:.25;} 40%{opacity:1;}}

/* ---------- client detail ---------- */
.client-hero{display:flex; align-items:center; gap:16px; margin-bottom:20px; flex-wrap:wrap;}
.client-hero .avatar-lg{width:64px; height:64px; border-radius:14px; font-size:22px;}
.client-hero .info h2{font-size:21px;}
.client-hero .info .meta-row{display:flex; gap:14px; flex-wrap:wrap; margin-top:6px; font-size:12.5px; color:var(--text-dim);}
.client-hero .info .meta-row span{display:flex; align-items:center; gap:5px;}
.client-hero .info .meta-row svg{width:13px; height:13px;}
.back-link{display:inline-flex; align-items:center; gap:6px; color:var(--text-dim); font-size:13px; margin-bottom:16px;}
.back-link svg{width:15px; height:15px;}
.back-link:hover{color:var(--gold-light);}
.file-chip{display:flex; align-items:center; gap:10px; background:var(--surface2); border:1px solid var(--line); border-radius:9px; padding:10px 13px; font-size:12.5px;}
.file-chip .fico{width:30px; height:30px; border-radius:7px; background:var(--gold-dim); display:flex; align-items:center; justify-content:center; flex-shrink:0;}
.file-chip .fico svg{width:14px; height:14px; color:var(--gold-light);}
.file-chip .fmain{flex:1; min-width:0;}
.file-chip .fmain b{display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.file-chip .fmain span{color:var(--text-faint); font-size:10.5px;}

/* ---------- toast ---------- */
.toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--surface3); border:1px solid var(--gold); color:var(--text); padding:11px 20px; border-radius:9px; font-size:13px; opacity:0; pointer-events:none; transition:.25s; z-index:200;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* ---------- responsive ---------- */
@media(max-width:960px){
  .stat-grid{grid-template-columns:repeat(2,1fr);}
  .ai-wrap, .two-col, .info-grid{grid-template-columns:1fr;}
}
@media(max-width:760px){
  .sidebar{position:fixed; right:0; top:0; z-index:90; transform:translateX(100%); transition:.25s; width:80vw; max-width:290px; box-shadow:-10px 0 30px rgba(0,0,0,.4);}
  .sidebar.open{transform:translateX(0);}
  .hamburger{display:flex; position:sticky; top:0; z-index:80; align-items:center; justify-content:space-between; gap:10px; background:#0c1626; border-bottom:1px solid var(--line); padding:12px 14px; margin:-14px -12px 16px;}
  [data-theme="light"] .hamburger{background:#ffffff;}
  .hamburger .l{display:flex; align-items:center; gap:9px; min-width:0;}
  .hamburger img{width:24px; height:24px; border-radius:6px; background:#fff; padding:2px; flex-shrink:0;}
  .hamburger b{color:var(--gold-light); font-family:'Almarai'; font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:46vw;}
  .hamburger button{background:transparent; border:1px solid var(--line); color:var(--text); width:38px; height:38px; border-radius:8px; font-size:16px; flex-shrink:0;}
  main{padding:14px 12px 50px;}
  .util-bar{margin-bottom:8px;}
  .topbar{margin-bottom:18px;}
  .topbar h2{font-size:20px;}
  .stat-grid{grid-template-columns:repeat(2,1fr); gap:10px;}
  .stat-card{padding:13px 14px;}
  .stat-card .num{font-size:23px; margin-top:8px;}
  .panel{padding:16px 15px;}
  .field-row{grid-template-columns:1fr;}
  .field input, .field select, .field textarea{font-size:16px; padding:11px 12px;}
  .modal{padding:18px 16px; max-width:100%; border-radius:12px;}
  .modal-actions{flex-direction:column;}
  .modal-actions .btn{width:100%;}
  .ask-row{flex-direction:column;}
  .ask-row .btn{width:100%;}
  .icon-btn{width:36px; height:36px;}
  .task-check{width:24px; height:24px;}
  .row-item{flex-wrap:wrap; gap:8px;}
  .file-chip{flex-wrap:wrap;}
  .quick-actions{gap:8px;}
  .qa-btn{padding:9px 13px; font-size:12px;}
  .client-hero{gap:12px;}
  .client-hero > div:last-child{margin-inline-start:0 !important; width:100%;}
  .client-hero > div:last-child .btn{flex:1;}
  .backdrop-mobile{display:none; position:fixed; inset:0; background:rgba(0,0,0,.5); z-index:85;}
  .backdrop-mobile.open{display:block;}
  .bell-panel{width:88vw; left:auto; right:0;}
  .donut-wrap{gap:14px;}
}
@media(max-width:480px){
  .case-grid, .res-grid{grid-template-columns:1fr;}
  .stat-grid{grid-template-columns:1fr 1fr;}
  .donut-wrap{flex-direction:column; align-items:flex-start;}
  .cal-toggle{width:100%;}
  .cal-btn{flex:1;}
}
</style>
</head>

/* كل كلمة مرور = معرّف حساب منفصل (هاش SHA-256) داخل قاعدة بيانات Firestore السحابية */
let fbApp, fbDb;

}
function emptyDB(){ return {clients:[], cases:[], tasks:[], notes:[], agencies:[], visits:[], policeCases:[], settings:{apiKey:''}}; }
function normalizeDB(d){
  d = Object.assign(emptyDB(), d||{});

  return d;
}

  if(!currentAccountId || !fbDb) return;

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function toast(msg){

  t.textContent = msg; t.classList.add('show');

function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d+'T00:00:00');
  return dt.toLocaleDateString('ar-SA-u-nu-latn',{year:'numeric',month:'short',day:'numeric'});
}
function daysUntil(d){
  if(!d) return null;
  const today = new Date(); today.setHours(0,0,0,0);
  const target = new Date(d+'T00:00:00');
  return Math.round((target-today)/86400000);
}
function esc(s){ return (s||'').toString().replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fileSizeLabel(bytes){
  if(bytes<1024) return bytes+' B';
  if(bytes<1024*1024) return (bytes/1024).toFixed(0)+' KB';
  return (bytes/1024/1024).toFixed(1)+' MB';
}

/* ---- Hijri <-> Gregorian conversion (tabular/civil Islamic calendar, approximate) ---- */
function gregorianToJD(y,m,d){
  const a = Math.floor((14-m)/12);
  const yy = y + 4800 - a;
  const mm = m + 12*a - 3;
  return d + Math.floor((153*mm+2)/5) + 365*yy + Math.floor(yy/4) - Math.floor(yy/100) + Math.floor(yy/400) - 32045;
}
function jdToGregorianISO(jd){
  let l = jd + 68569;
  const n = Math.floor((4*l)/146097);
  l = l - Math.floor((146097*n+3)/4);
  const i = Math.floor((4000*(l+1))/1461001);
  l = l - Math.floor((1461*i)/4) + 31;
  const j = Math.floor((80*l)/2447);
  const day = l - Math.floor((2447*j)/80);
  l = Math.floor(j/11);
  const month = j + 2 - 12*l;
  const year = 100*(n-49) + i + l;
  const mm = String(month).padStart(2,'0'), dd = String(day).padStart(2,'0');
  return year+'-'+mm+'-'+dd;
}
function hijriToGregorianISO(hy,hm,hd){
  const jd = Math.floor((11*hy+3)/30) + 354*hy + 30*hm - Math.floor((hm-1)/2) + hd + 1948440 - 385;
  return jdToGregorianISO(jd);
}
function gregorianISOToHijri(iso){
  if(!iso) return null;
  const [y,m,d] = iso.split('-').map(Number);
  const jd = gregorianToJD(y,m,d);
  let l = jd - 1948440 + 10632;
  const n = Math.floor((l-1)/10631);
  l = l - 10631*n + 354;
  const j = (Math.floor((10985-l)/5316))*(Math.floor((50*l)/17719)) + (Math.floor(l/5670))*(Math.floor((43*l)/15238));
  l = l - (Math.floor((30-j)/15))*(Math.floor((17719*j)/50)) - (Math.floor(j/16))*(Math.floor((15238*j)/43)) + 29;
  const month = Math.floor((24*l)/709);
  const day = l - Math.floor((709*month)/24);
  const year = 30*n + j - 30;
  return {year, month, day};
}
/* ---- reusable date field with Hijri/Gregorian toggle ---- */
function dateFieldHtml(id, iso, label){
  return `<div class="field">
    <div style="display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:6px;">
      <label style="margin-bottom:0;">${label}</label>
      <div class="cal-toggle" id="${id}_toggle" data-mode="g">
        <button type="button" class="cal-btn active" onclick="setDateMode('${id}','g')">ميلادي</button>
        <button type="button" class="cal-btn" onclick="setDateMode('${id}','h')">هجري</button>
      </div>
    </div>
    <input type="date" id="${id}_g" value="${iso||''}" style="margin-top:6px;">
    <div id="${id}_h" class="hijri-row" style="display:none; margin-top:6px;">
      <input type="number" id="${id}_hd" placeholder="يوم" min="1" max="30">
      <input type="number" id="${id}_hm" placeholder="شهر" min="1" max="12">
      <input type="number" id="${id}_hy" placeholder="سنة هـ">
    </div>
  </div>`;
}
function setDateMode(id, mode){
  const toggle = document.getElementById(id+'_toggle');
  toggle.dataset.mode = mode;
  toggle.querySelectorAll('.cal-btn').forEach((b,i)=>b.classList.toggle('active', (i===0&&mode==='g')||(i===1&&mode==='h')));
  document.getElementById(id+'_g').style.display = mode==='g' ? '' : 'none';
  document.getElementById(id+'_h').style.display = mode==='h' ? 'flex' : 'none';
}
function getDateValue(id){
  const toggle = document.getElementById(id+'_toggle');
  const mode = toggle ? toggle.dataset.mode : 'g';
  if(mode==='h'){
    const hd = parseInt(document.getElementById(id+'_hd').value);
    const hm = parseInt(document.getElementById(id+'_hm').value);
    const hy = parseInt(document.getElementById(id+'_hy').value);
    if(!hd||!hm||!hy) return '';
    try{ return hijriToGregorianISO(hy,hm,hd); }catch(e){ return ''; }
  }
  return document.getElementById(id+'_g').value;
}

function getReminders(){
  const items = [];
  db.cases.forEach(c=>{ if(c.nextHearing) items.push({type:'hearing', title:c.title, date:c.nextHearing, days:daysUntil(c.nextHearing), meta:c.court||'جلسة', icon:'briefcase'}); });
  db.tasks.forEach(t=>{ if(!t.done && t.due) items.push({type:'task', title:t.title, date:t.due, days:daysUntil(t.due), meta:t.caseId?caseTitle(t.caseId):'مهمة', icon:'check_sq'}); });
  db.agencies.forEach(a=>{ if(a.expiryDate) items.push({type:'agency', title:agencyLabel(a), date:a.expiryDate, days:daysUntil(a.expiryDate), meta:clientName(a.clientId), icon:'scroll'}); });
  db.visits.forEach(v=>{ if(v.status!=='done' && v.date) items.push({type:'visit', title:v.title, date:v.date, days:daysUntil(v.date), meta:v.location||'مراجعة ميدانية', icon:'pin'}); });
  return items.sort((a,b)=>a.days-b.days);
}
function dotColor(days){ if(days<0) return 'var(--danger)'; if(days<=3) return 'var(--gold)'; return 'var(--ok)'; }

function waLink(phone){
  if(!phone) return '';
  let digits = phone.replace(/[^0-9]/g,'');
  if(digits.startsWith('00')) digits = digits.slice(2);
  if(digits.startsWith('0')) digits = '966'+digits.slice(1);
  else if(!digits.startsWith('966') && digits.length===9) digits = '966'+digits;
  return 'https://wa.me/'+digits;
}

async function uploadClientFile(clientId){
  const input = document.getElementById('f_fileInput');
  const file = input.files[0];
  if(!file){ toast('اختر ملفًا أولًا'); return; }
  if(file.size > 900*1024){ toast('الملف كبير جدًا — الحد الأقصى 900 كيلوبايت لكل ملف'); return; }
  const caseId = document.getElementById('f_fileCase').value;
  const reader = new FileReader();
  reader.onload = async e=>{
    const fileId = uid();
    try{
      await accountDoc().collection('files').doc(fileId).set({dataUrl:e.target.result});
    }catch(err){ toast('تعذّر رفع الملف — تحقق من الاتصال بالإنترنت.'); return; }
    const cl = db.clients.find(c=>c.id===clientId);
    cl.files = cl.files||[];
    cl.files.push({id:fileId, fileName:file.name, mime:file.type, size:file.size, caseId, date:new Date().toISOString().slice(0,10)});
    saveDB(); toast('تم رفع الملف'); render();
  };
  reader.onerror = ()=> toast('تعذّرت قراءة الملف');
  reader.readAsDataURL(file);
}
async function downloadClientFile(fileId, fileName){
  toast('جارٍ تحضير الملف...');
  try{
    const doc = await accountDoc().collection('files').doc(fileId).get();
    if(!doc.exists){ toast('تعذّر العثور على الملف'); return; }
    const a = document.createElement('a');
    a.href = doc.data().dataUrl; a.download = fileName; a.click();
  }catch(e){ toast('تعذّر تنزيل الملف — تحقق من الاتصال بالإنترنت.'); }
}
function deleteClientFile(clientId, fileId){
  confirmDelete('سيتم حذف هذا الملف نهائيًا من ملف العميل. هل أنت متأكد؟', ()=>{
    const cl = db.clients.find(c=>c.id===clientId);
    cl.files = (cl.files||[]).filter(f=>f.id!==fileId);
    accountDoc().collection('files').doc(fileId).delete().catch(()=>{});
    saveDB(); closeModal(); render();
  });
}

/* ============ TASKS ============ */
function viewTasks(){
  const sorted = [...db.tasks].sort((a,b)=>{ if(a.done!==b.done) return a.done?1:-1; return (a.due||'9999').localeCompare(b.due||'9999'); });
  const doneTasks = db.tasks.filter(t=>t.done).length;
  const pendingTasks = db.tasks.length - doneTasks;
  return `
  <div class="topbar">
    <div><h2>المهام والمواعيد</h2><div class="sub">${pendingTasks} مهمة معلّقة من أصل ${db.tasks.length}</div></div>
    <button class="btn btn-gold" onclick="openTaskForm()">${ic('plus')}مهمة جديدة</button>
  </div>
  <div class="panel">
    ${sorted.length ? `<div class="row-list">${sorted.map(rowTaskHtml).join('')}</div>` : emptyState('لا توجد مهام مسجّلة.','check_sq')}
  </div>
  `;
}
function rowTaskHtml(t){
  const d = t.due ? daysUntil(t.due) : null;
  const cls = t.done ? '' : (d!==null && d<0 ? 'overdue' : (d!==null && d<=2 ? 'soon' : ''));
  return `<div class="row-item ${cls}">
    <div style="display:flex; align-items:center; gap:12px; min-width:0;">
      <div class="task-check ${t.done?'done':''}" onclick="toggleTask('${t.id}')">${t.done?ic('check'):''}</div>
      <div class="main">
        <b style="${t.done?'text-decoration:line-through; color:var(--text-faint);':''}">${esc(t.title)}</b>
        <span class="meta">${t.caseId?esc(caseTitle(t.caseId))+' · ':''}${t.due?fmtDate(t.due):'بدون تاريخ استحقاق'}${d!==null && !t.done ? (d<0?' (متأخرة)':d===0?' (اليوم)':'') : ''}</span>
      </div>
    </div>
    <div class="actions">
      <button class="icon-btn" onclick="openTaskForm('${t.id}')" title="تعديل">${ic('edit')}</button>
      <button class="icon-btn del" onclick="deleteTask('${t.id}')" title="حذف">${ic('trash')}</button>
    </div>
  </div>`;
}
function toggleTask(id){ const t = db.tasks.find(x=>x.id===id); t.done = !t.done; saveDB(); render(); }
function openTaskForm(id){
  const t = id ? db.tasks.find(x=>x.id===id) : null;
  const caseOptions = db.cases.map(c=>`<option value="${c.id}" ${t&&t.caseId===c.id?'selected':''}>${esc(c.title)}</option>`).join('');
  openModal(`
    <h3>${t?'تعديل المهمة':'مهمة جديدة'}</h3>
    <div class="field"><label>عنوان المهمة</label><input id="f_ttitle" value="${t?esc(t.title):''}" placeholder="مثال: تقديم مذكرة الرد"></div>
    <div class="field"><label>القضية المرتبطة (اختياري)</label><select id="f_tcase"><option value="">— بدون —</option>${caseOptions}</select></div>
    ${dateFieldHtml('f_tdue', t?t.due:'', 'تاريخ الاستحقاق')}
    <div class="modal-actions">
      <button class="btn btn-gold btn-block" onclick="saveTask(${t?`'${t.id}'`:'null'})">حفظ</button>
      ${t?`<button class="btn btn-ghost" onclick="deleteTask('${t.id}')">حذف</button>`:''}
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}
function saveTask(id){
  const title = document.getElementById('f_ttitle').value.trim();
  if(!title){ toast('الرجاء إدخال عنوان المهمة'); return; }
  const data = { title, caseId: document.getElementById('f_tcase').value, due: getDateValue('f_tdue') };
  if(id){ Object.assign(db.tasks.find(t=>t.id===id), data); toast('تم التحديث'); }
  else{ data.id = uid(); data.done = false; db.tasks.push(data); toast('تمت الإضافة'); }
  saveDB(); closeModal(); render();
}
function deleteTask(id){
  confirmDelete('سيتم حذف هذه المهمة نهائيًا. هل أنت متأكد؟', ()=>{
    db.tasks = db.tasks.filter(t=>t.id!==id); saveDB(); closeModal(); render();
  });
}

function saveApiKey(){ db.settings.apiKey = document.getElementById('apiKeyInput').value.trim(); saveDB(); toast('تم حفظ المفتاح مع حسابك'); }
function fillPrompt(text){ document.getElementById('aiInput').value = text; document.getElementById('aiInput').focus(); }
function renderChatLog(){
  const log = document.getElementById('chatLog');
  if(!log) return;
  log.innerHTML = chatHistory.map(m=>`<div class="msg ${m.role}">${esc(m.text)}</div>`).join('') || `<div class="empty" style="padding:16px;"><p>ابدأ المحادثة بسؤال قانوني عام، أو استخدم أحد الاقتراحات أعلاه.</p></div>`;
  log.scrollTop = log.scrollHeight;
}
async function sendAI(){
  const input = document.getElementById('aiInput');
  const question = input.value.trim();
  if(!question) return;
  const apiKey = db.settings.apiKey;
  chatHistory.push({role:'user', text:question});
  input.value = ''; renderChatLog();
  if(!apiKey){
    chatHistory.push({role:'err', text:'لم يتم إدخال مفتاح API. أضف مفتاحك في قسم "الإعداد"، أو استخدم claude.ai مباشرة لطرح هذا السؤال مجانًا.'});
    renderChatLog(); return;
  }
  const log = document.getElementById('chatLog');
  const typingId = 'typing_'+uid();
  log.insertAdjacentHTML('beforeend', `<div class="msg ai" id="${typingId}"><div class="typing"><span></span><span></span><span></span></div></div>`);
  log.scrollTop = log.scrollHeight;
  try{
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{ 'Content-Type':'application/json', 'x-api-key': apiKey, 'anthropic-version':'2023-06-01', 'anthropic-dangerous-direct-browser-access':'true' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-6', max_tokens: 1000,
        system: 'أنت مساعد معلوماتي عام لمحامٍ سعودي فردي داخل تطبيق إدارة قضايا. أجب بالعربية الفصحى بإيجاز ووضوح، مع الإشارة إلى الأنظمة السعودية ذات الصلة إن أمكن. لا تقدّم إجاباتك كاستشارة قانونية نهائية أو حكم قطعي في واقعة بعينها، بل كخلفية عامة يجب على المحامي التحقق منها من المصادر الرسمية.',
        messages: chatHistory.filter(m=>m.role==='user'||m.role==='ai').map(m=>({role:m.role==='ai'?'assistant':'user', content:m.text}))
      })
    });
    document.getElementById(typingId)?.remove();
    if(!res.ok){ const errText = await res.text().catch(()=> ''); throw new Error('HTTP '+res.status+' '+errText.slice(0,180)); }
    const data = await res.json();
    const text = (data.content||[]).map(b=>b.text||'').join('\\n').trim() || 'لم يصل رد نصي من النموذج.';
    chatHistory.push({role:'ai', text});
  }catch(err){
    document.getElementById(typingId)?.remove();
    chatHistory.push({role:'err', text:'تعذّر الاتصال بواجهة الذكاء الاصطناعي مباشرة من المتصفح (قد يكون بسبب قيود CORS أو صلاحية المفتاح). كبديل موثوق ومجاني، افتح claude.ai في نافذة أخرى واطرح سؤالك هناك.'});
  }
  renderChatLog();
}

function exportBackup(){
  const blob = new Blob([JSON.stringify(db,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'maqrilaw-backup-'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
}
function importBackup(){
  const file = document.getElementById('importFile').files[0];
  if(!file){ toast('اختر ملفًا أولًا'); return; }
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      if(!parsed.cases || !parsed.clients) throw new Error();
      db = normalizeDB(parsed);
      saveDB(); toast('تم الاستيراد بنجاح'); render();
    }catch(err){ toast('ملف غير صالح'); }
  };
  reader.readAsText(file);
}
function wipeAll(){
  confirmDelete('سيتم حذف جميع البيانات (القضايا، العملاء، الوكالات، المهام، الملفات...) نهائيًا ولا يمكن التراجع عن هذا. هل أنت متأكد تمامًا؟', ()=>{
    db = {clients:[], cases:[], tasks:[], notes:[], agencies:[], visits:[], policeCases:[], settings:{apiKey:''}};
    saveDB(); closeModal(); toast('تم الحذف'); render();
  });
}

/* ============ THEME (dark / light) ============ */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme', t==='light'?'light':'dark');
  renderThemeBtn();
}
function toggleTheme(){
  const cur = localStorage.getItem('maqri_theme')||'dark';
  const next = cur==='dark' ? 'light' : 'dark';
  localStorage.setItem('maqri_theme', next);
  applyTheme(next);
}
function renderThemeBtn(){
  const btn = document.getElementById('themeBtn');
  if(!btn) return;
  const cur = localStorage.getItem('maqri_theme')||'dark';
  btn.innerHTML = cur==='dark' ? ic('sun') : ic('moon');
  btn.title = cur==='dark' ? 'التبديل إلى الوضع الفاتح' : 'التبديل إلى الوضع الداكن';
}
applyTheme(localStorage.getItem('maqri_theme')||'dark');

/* ============ INIT ============ */
let clockTimer = null;
function startClock(){
  clearInterval(clockTimer);
  const el = document.getElementById('liveClock');
  if(!el) return;
  const tick = ()=>{
    const e = document.getElementById('liveClock');
    if(!e){ clearInterval(clockTimer); return; }
    e.textContent = new Date().toLocaleTimeString('ar-SA-u-nu-latn',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  };
  tick();
  clockTimer = setInterval(tick, 1000);
}
function animateNumbers(){
  document.querySelectorAll('.stat-card .num').forEach(el=>{
    const target = parseInt(el.textContent)||0;
    if(target<=0){ el.textContent = String(target); return; }
    let cur = 0;
    const step = Math.max(1, Math.ceil(target/16));
    const t = setInterval(()=>{
      cur += step;
      if(cur>=target){ cur=target; clearInterval(t); }
      el.textContent = String(cur);
    }, 22);
  });
}
function bindViewEvents(){
  if(currentView==='ai') renderChatLog();
  if(currentView==='dashboard'){ renderBell(); startClock(); }
  renderThemeBtn();
  animateNumbers();
}

/* ============ AUTH GATE (local password lock) ============ */
async function sha256(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
function authLogos(){
  const light = document.querySelector('.sidebar .brand-logo-light');
  const dark = document.querySelector('.sidebar .brand-logo-dark');
  const lightSrc = light ? light.src : '';
  const darkSrc = dark ? dark.src : '';
  return `<img class="brand-logo brand-logo-light" src="${lightSrc}" alt="شعار المكتب">
          <img class="brand-logo brand-logo-dark" src="${darkSrc}" alt="شعار المكتب">`;
}
function showAuthScreen(html){
  document.getElementById('authScreen').innerHTML = `<div class="auth-card">${authLogos()}${html}</div>`;
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('appRoot').style.display = 'none';
}
function checkAuth(){
  if(!isFirebaseConfigured()){
    showAuthScreen(`
      <h2>الإعداد غير مكتمل</h2>
      <p class="sub" style="color:var(--danger-light);">لم يتم إدخال بيانات قاعدة البيانات السحابية (Firebase) بعد. افتح الملف وعدّل قسم "FIREBASE_CONFIG" في أعلى الصفحة بالبيانات الخاصة بمشروعك، ثم أعد فتح الملف.</p>
    `);
    return;
  }
  if(typeof firebase === 'undefined'){
    showAuthScreen(`
      <h2>تعذّر تحميل مكتبة قاعدة البيانات</h2>
      <p class="sub" style="color:var(--danger-light);">لم تتمكن الصفحة من تحميل مكتبة Firebase من الإنترنت. تحقق من اتصال الإنترنت، أو أن الشبكة/الجدار الناري لديك لا يحجب موقع gstatic.com، ثم أعد تحميل الصفحة.</p>
      <button class="btn btn-gold btn-block" onclick="location.reload()">إعادة المحاولة</button>
    `);
    return;
  }
  initFirebase();
  const saved = sessionStorage.getItem('maqri_account');
  if(saved){
    accountDocById(saved).get().then(doc=>{
      if(doc.exists){ db = normalizeDB(doc.data().data); currentAccountId = saved; currentUsername = doc.data().username||''; showApp(); }
      else{ sessionStorage.removeItem('maqri_account'); renderAuthLogin(); }
    }).catch(()=>{ renderAuthLogin(); });
  } else {
    renderAuthLogin();
  }
}
function isFirebaseConfigured(){
  return FIREBASE_CONFIG && FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.includes('ضع_');
}
function accountDocById(id){ return fbDb.collection('accounts').doc(id); }
/* معرّف الحساب مشتق من اسم المستخدم وكلمة المرور معًا، حتى لا يمكن معرفة وجود حساب أو الوصول إليه دون الاثنين معًا */
async function computeAccountId(username, password){
  return sha256((username||'').trim().toLowerCase()+'::'+password);
}
function showApp(){
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('authScreen').innerHTML = '';
  document.getElementById('appRoot').style.display = '';
  render();
}
function renderAuthLogin(){
  showAuthScreen(`
    <h2>الدخول إلى النظام</h2>
    <p class="sub">مكتب المحامي محمد مقري — أدخل اسم المستخدم وكلمة المرور الخاصين بحسابك.</p>
    <div class="field"><label>اسم المستخدم</label><input id="authUser" onkeydown="if(event.key==='Enter') document.getElementById('authPwInput').focus()"></div>
    <div class="field"><label>كلمة المرور</label><input type="password" id="authPwInput" onkeydown="if(event.key==='Enter') attemptLogin()"></div>
    <div class="auth-err" id="authErr"></div>
    <button class="btn btn-gold btn-block" onclick="attemptLogin()">دخول</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="renderAuthSignup()">إنشاء حساب جديد</button>
  `);
}
function renderAuthSignup(){
  showAuthScreen(`
    <h2>إنشاء حساب جديد</h2>
    <p class="sub">اختر اسم مستخدم وكلمة مرور لحسابك. بياناتك ستُحفظ مرتبطة بهما معًا — احتفظ بهما جيدًا، فلا يمكن استرجاع البيانات بدونهما.</p>
    <div class="field"><label>اسم المستخدم</label><input id="suUser"></div>
    <div class="field"><label>كلمة المرور</label><input type="password" id="suPw1"></div>
    <div class="field"><label>تأكيد كلمة المرور</label><input type="password" id="suPw2" onkeydown="if(event.key==='Enter') attemptSignup()"></div>
    <div class="auth-err" id="suErr"></div>
    <button class="btn btn-gold btn-block" onclick="attemptSignup()">إنشاء الحساب</button>
    <button class="btn btn-ghost btn-block" style="margin-top:8px;" onclick="renderAuthLogin()">لديك حساب بالفعل؟ الدخول</button>
  `);
}
async function attemptLogin(){
  const u = document.getElementById('authUser').value.trim();
  const p = document.getElementById('authPwInput').value;
  const err = document.getElementById('authErr');
  err.style.display = 'none';
  if(!u || !p){ err.textContent='الرجاء إدخال اسم المستخدم وكلمة المرور'; err.style.display='block'; return; }
  if(!fbDb){ err.textContent='تعذّر الاتصال بقاعدة البيانات — تحقق من إعداد Firebase في الملف.'; err.style.display='block'; return; }
  const id = await computeAccountId(u, p);
  try{
    const doc = await accountDocById(id).get();
    if(doc.exists){
      db = normalizeDB(doc.data().data);
      currentAccountId = id;
      currentUsername = u;
      sessionStorage.setItem('maqri_account', id);
      showApp();
    } else {
      err.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة، أو لا يوجد حساب بهذه البيانات بعد.';
      err.style.display = 'block';
    }
  }catch(e){
    err.textContent = 'تعذّر الاتصال بقاعدة البيانات. تحقق من اتصال الإنترنت.';
    err.style.display = 'block';
  }
}
async function attemptSignup(){
  const u = document.getElementById('suUser').value.trim();
  const p1 = document.getElementById('suPw1').value;
  const p2 = document.getElementById('suPw2').value;
  const err = document.getElementById('suErr');
  err.style.display = 'none';
  if(u.length<2){ err.textContent='اسم المستخدم قصير جدًا'; err.style.display='block'; return; }
  if(p1.length<4){ err.textContent='كلمة المرور يجب أن تكون 4 أحرف على الأقل'; err.style.display='block'; return; }
  if(p1!==p2){ err.textContent='كلمتا المرور غير متطابقتين'; err.style.display='block'; return; }
  if(!fbDb){ err.textContent='تعذّر الاتصال بقاعدة البيانات — تحقق من إعداد Firebase في الملف.'; err.style.display='block'; return; }
  const id = await computeAccountId(u, p1);
  try{
    const existing = await accountDocById(id).get();
    if(existing.exists){ err.textContent='يوجد حساب بهذه البيانات مسبقًا — جرّب الدخول بدلًا من ذلك.'; err.style.display='block'; return; }
    db = emptyDB();
    currentAccountId = id;
    currentUsername = u;
    await accountDocById(id).set({username:u, data:db});
    sessionStorage.setItem('maqri_account', id);
    showApp();
  }catch(e){
    err.textContent = 'تعذّر إنشاء الحساب — تحقق من الاتصال بالإنترنت.';
    err.style.display = 'block';
  }
}
function openChangePasswordForm(){
  openModal(`
    <h3>تغيير كلمة المرور</h3>
    <p style="font-size:12.5px; color:var(--text-dim); margin-bottom:12px; line-height:1.8;">سيتم نقل جميع بياناتك إلى بيانات الدخول الجديدة.</p>
    <div class="field"><label>اسم المستخدم</label><input id="cp_user" value="${esc(currentUsername||'')}"></div>
    <div class="field"><label>كلمة المرور الحالية</label><input type="password" id="cp_old"></div>
    <div class="field"><label>كلمة المرور الجديدة</label><input type="password" id="cp_new1"></div>
    <div class="field"><label>تأكيد كلمة المرور الجديدة</label><input type="password" id="cp_new2"></div>
    <div class="auth-err" id="cp_err" style="text-align:right;"></div>
    <div class="modal-actions">
      <button class="btn btn-gold btn-block" onclick="submitChangePassword()">حفظ</button>
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
    </div>
  `);
}
async function submitChangePassword(){
  const u = document.getElementById('cp_user').value.trim();
  const oldPw = document.getElementById('cp_old').value;
  const n1 = document.getElementById('cp_new1').value;
  const n2 = document.getElementById('cp_new2').value;
  const err = document.getElementById('cp_err');
  err.style.display = 'none';
  const oldId = await computeAccountId(u, oldPw);
  if(oldId !== currentAccountId){ err.textContent='اسم المستخدم أو كلمة المرور الحالية غير صحيحة'; err.style.display='block'; return; }
  if(n1.length<4){ err.textContent='كلمة المرور الجديدة قصيرة جدًا'; err.style.display='block'; return; }
  if(n1!==n2){ err.textContent='كلمتا المرور الجديدتان غير متطابقتين'; err.style.display='block'; return; }
  const newId = await computeAccountId(u, n1);
  try{
    await accountDocById(newId).set({username:u, data:db});
    await accountDocById(currentAccountId).delete();
    currentAccountId = newId;
    sessionStorage.setItem('maqri_account', newId);
    toast('تم تغيير كلمة المرور'); closeModal();
  }catch(e){ toast('تعذّر تغيير كلمة المرور — تحقق من الاتصال بالإنترنت.'); }
}
function lockNow(){
  sessionStorage.removeItem('maqri_account');
  location.reload();
}

checkAuth();
</script>
</body>
</html>
